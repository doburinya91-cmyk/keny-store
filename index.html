<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keny Store</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f1117;
    color: #e6e8ee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header { padding: 28px 20px 20px; text-align: center; }
  header h1 { font-size: 28px; letter-spacing: 0.5px; }
  header h1 span { color: #4f8cff; }
  header p { color: #9aa0b0; margin-top: 6px; font-size: 14px; }
  main { flex: 1; width: 100%; max-width: 960px; margin: 0 auto; padding: 12px 16px 32px; }
  #updated { color: #6b7180; font-size: 12px; margin-bottom: 12px; }
  .appbox {
    display: none;
    align-items: center;
    gap: 14px;
    background: #16203a;
    border: 1px solid #2b3550;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .appbox.show { display: flex; }
  .appbox .t { flex: 1; min-width: 0; }
  .appbox .t b { font-size: 15px; }
  .appbox .t div { color: #9aa0b0; font-size: 12.5px; margin-top: 3px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: #1a1d27;
    border: 1px solid #262a38;
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .card:hover { border-color: #3a4a63; }
  .top { display: flex; gap: 14px; align-items: flex-start; }
  .top img { width: 72px; height: 72px; border-radius: 14px; flex-shrink: 0; object-fit: cover; background: #262a38; }
  .info { flex: 1; min-width: 0; }
  .info h2 { font-size: 17px; margin-bottom: 3px; word-wrap: break-word; }
  .tag { color: #9aa0b0; font-size: 13px; line-height: 1.35; }
  .meta { color: #4f8cff; font-size: 12px; margin-top: 6px; }
  .shots { display: flex; gap: 8px; margin-top: 12px; overflow: hidden; }
  .shots img { width: 62px; height: 134px; border-radius: 8px; object-fit: cover; object-position: top; flex-shrink: 0; background: #262a38; }
  .shots video { width: 62px; height: 134px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #000; }
  .player { margin-top: 14px; border: 1px solid #2b3145; border-radius: 12px; overflow: hidden; background: #000; }
  .player video { display: block; width: 100%; max-height: 62vh; background: #000; }
  .btn {
    display: inline-block;
    background: #4f8cff;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    padding: 9px 18px;
    border-radius: 8px;
    margin-top: 12px;
  }
  .btn:active { background: #3a6fd4; }
  .empty, .error { text-align: center; color: #9aa0b0; padding: 60px 20px; font-size: 15px; line-height: 1.6; }
  footer { color: #6b7180; font-size: 12px; text-align: center; padding: 16px; border-top: 1px solid #1e2230; }

  #modal { position: fixed; inset: 0; background: rgba(6,8,14,.78); display: none; overflow-y: auto; padding: 24px 14px; }
  #modal.open { display: block; }
  .sheet {
    background: #151823;
    border: 1px solid #2a2f40;
    border-radius: 16px;
    max-width: 640px;
    margin: 0 auto;
    padding: 20px;
  }
  .sheet .head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .sheet .head img { width: 68px; height: 68px; border-radius: 14px; object-fit: cover; background: #262a38; }
  .sheet h2 { font-size: 21px; }
  .sheet .meta2 { color: #8b93a7; font-size: 13px; margin-top: 4px; }
  .gal { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin: 4px 0 14px; }
  .gal img { width: 150px; height: 320px; border-radius: 10px; object-fit: cover; object-position: top; flex-shrink: 0; background: #262a38; }
  .full { color: #c4cadb; font-size: 14px; line-height: 1.6; }
  .close { float: right; background: none; border: 0; color: #8b93a7; font-size: 26px; cursor: pointer; line-height: 1; }
</style>
</head>
<body>
<header>
  <h1>Keny <span>Store</span></h1>
  <p>Личный магазин игр — скачивай и играй</p>
</header>
<main>
  <div id="updated"></div>
  <div id="appbox" class="appbox"></div>
  <div id="list"><div class="empty">Загрузка каталога…</div></div>
</main>
<footer>При первой установке разрешите браузеру «установку из неизвестных источников».</footer>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
let games = [];
fetch('catalog.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(cat => {
    document.getElementById('updated').textContent = 'Обновлено: ' + (cat.updated || '—');
    const app = cat.app;
    if (app && app.apk) {
      const box = document.getElementById('appbox');
      box.innerHTML = `
        <div class="t">
          <b>Телефонное приложение Keny Store</b>
          <div>v${esc(app.version || '1.0')}${app.size ? ' · ' + Number(app.size).toFixed(1) + ' МБ' : ''} · для Android</div>
        </div>
        <a class="btn" href="${url(app.apk)}">Скачать магазин</a>`;
      box.classList.add('show');
    }
    games = cat.games || [];
    const list = document.getElementById('list');
    if (!games.length) {
      list.innerHTML = '<div class="empty">Пока пусто.<br>Первые игры скоро появятся.</div>';
      return;
    }
    list.innerHTML = '<div class="grid">' + games.map((g, i) => `
      <div class="card" onclick="openGame(${i})">
        <div class="top">
          <img src="${url(g.icon)}" alt="" onerror="this.style.visibility='hidden'">
          <div class="info">
            <h2>${esc(g.name)}</h2>
            <div class="tag">${esc(g.tagline || g.description || '')}</div>
            <div class="meta">v${esc(g.version)}${g.size ? ' · ' + esc(g.size) + ' МБ' : ''}</div>
          </div>
        </div>
        ${shots(g, 3, true)}
        <a class="btn" href="${url(g.apk)}" onclick="event.stopPropagation()">Скачать APK</a>
      </div>`).join('') + '</div>';
  })
  .catch(() => {
    document.getElementById('list').innerHTML =
      '<div class="error">Не удалось загрузить каталог.<br>Проверьте интернет и обновите страницу.</div>';
  });

function shots(g, max, withVideo) {
  const s = g.screenshots || [];
  const v = (withVideo && g.video)
    ? `<video src="${url(g.video)}" muted loop autoplay playsinline preload="metadata"></video>` : '';
  if (!s.length && !v) return '';
  return '<div class="shots">' + v + s.slice(0, max).map(u =>
    `<img src="${url(u)}" alt="" loading="lazy" onerror="this.remove()">`).join('') + '</div>';
}

function player(g) {
  if (!g.video) return '';
  const poster = (g.screenshots && g.screenshots[0]) ? `poster="${url(g.screenshots[0])}"` : '';
  return `<div class="player"><video src="${url(g.video)}" ${poster} controls autoplay muted loop playsinline preload="metadata"></video></div>`;
}

function openGame(i) {
  const g = games[i];
  document.getElementById('sheet').innerHTML = `
    <button class="close" onclick="closeGame()">×</button>
    <div class="head">
      <img src="${url(g.icon)}" alt="" onerror="this.style.visibility='hidden'">
      <div>
        <h2>${esc(g.name)}</h2>
        <div class="meta2">v${esc(g.version)}${g.size ? ' · ' + esc(g.size) + ' МБ' : ''} · ${esc(g.id)}</div>
      </div>
    </div>
    ${g.tagline ? '<div class="tag">' + esc(g.tagline) + '</div>' : ''}
    ${player(g)}
    ${shots(g, 20).replace('class="shots"', 'class="gal"')}
    <div class="full">${esc(g.description || '')}</div>
    <a class="btn" href="${url(g.apk)}">Скачать APK</a>`;
  document.getElementById('modal').classList.add('open');
}

function closeGame() {
  // ролик за закрытой карточкой продолжал бы играть звук и жрать трафик
  document.querySelectorAll('#sheet video').forEach(v => v.pause());
  document.getElementById('modal').classList.remove('open');
}
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeGame(); });

function url(u) { return u ? String(u).replace(/"/g, '&quot;') : 'icon.png'; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
